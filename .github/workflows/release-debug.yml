name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-beta31)'
        required: true
        default: 'v0.9.0-beta31'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # MainActivity 以外のディレクトリをCI内で一時退避
      - name: Temporarily hide extra source directories
        shell: bash
        run: |
          set -eux
          base_java="android/app/src/main/java/com/fightcalendar/app"
          base_kt="android/app/src/main/kotlin/com/fightcalendar/app"
          for dir in di data db domain worker "ui/screens" "ui/theme"; do
            [ -d "$base_java/$dir" ] && mv "$base_java/$dir" "$base_java/_bak_${dir//\//_}"
            [ -d "$base_kt/$dir" ] && mv "$base_kt/$dir" "$base_kt/_bak_${dir//\//_}"
          done
          echo "Remaining Kotlin sources:"
          find android/app/src/main -name "*.kt" -maxdepth 5 | sed 's/^/  /' || true

      - name: Assemble app (no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: >
            :app:clean :app:assembleDebug
            --stacktrace --warning-mode all --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          echo "APK=$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
