name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-mvp-min-01)'
        required: true
        default: 'v0.9.0-mvp-min-01'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Rewrite settings.gradle.kts (clean)
        shell: bash
        run: |
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "fight-calendar"
          include(":app")
          EOF

      - name: Rewrite root build.gradle.kts (plugins)
        shell: bash
        run: |
          cat > android/build.gradle.kts << 'EOF'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

      - name: Rewrite AndroidManifest.xml (minimal)
        shell: bash
        run: |
          mkdir -p android/app/src/main
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.fightcalendar.app">
            <application
                android:allowBackup="true"
                android:label="Fight Calendar"
                android:icon="@android:drawable/sym_def_app_icon"
                android:roundIcon="@android:drawable/sym_def_app_icon"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
              <activity
                  android:name=".MainActivity"
                  android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

      - name: Rewrite MainActivity.java (minimal)
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/fightcalendar/app
          cat > android/app/src/main/java/com/fightcalendar/app/MainActivity.java << 'EOF'
          package com.fightcalendar.app;

          import android.os.Bundle;
          import android.view.Gravity;
          import android.widget.FrameLayout;
          import android.widget.TextView;

          import androidx.appcompat.app.AppCompatActivity;

          public class MainActivity extends AppCompatActivity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  FrameLayout root = new FrameLayout(this);
                  TextView tv = new TextView(this);
                  tv.setText("Fight Calendar");
                  tv.setTextSize(20f);
                  tv.setPadding(32, 32, 32, 32);
                  tv.setGravity(Gravity.CENTER);
                  root.addView(tv);

                  setContentView(root);
              }
          }
          EOF

      - name: Temporarily hide Kotlin sources
        shell: bash
        run: |
          find android/app/src/main -name "*.kt" -exec bash -lc 'mv "$1" "$1.bak"' _ {} \; || true
          echo "Remaining sources:"; find android/app/src/main -maxdepth 5 -type f | sed 's/^/  /' || true

      - name: Wipe res and create minimal strings/attrs/styles
        shell: bash
        run: |
          set -eux
          find android/app/src -type d -name "res" -exec rm -rf {} + || true
          mkdir -p android/app/src/main/res/values
          # strings.xml
          cat > android/app/src/main/res/values/strings.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <string name="app_name">Fight Calendar</string>
          </resources>
          EOF
          # attrs.xml (ダミー属性)
          cat > android/app/src/main/res/values/attrs.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <attr name="colorPrimary" format="color"/>
            <attr name="colorOnPrimary" format="color"/>
            <attr name="colorPrimaryContainer" format="color"/>
            <attr name="colorOnPrimaryContainer" format="color"/>
            <attr name="colorSecondary" format="color"/>
            <attr name="colorOnSecondary" format="color"/>
            <attr name="colorSecondaryContainer" format="color"/>
            <attr name="colorOnSecondaryContainer" format="color"/>
            <attr name="colorTertiary" format="color"/>
            <attr name="colorOnTertiary" format="color"/>
            <attr name="colorSurface" format="color"/>
            <attr name="colorOnSurface" format="color"/>
          </resources>
          EOF
          # styles.xml (Theme.Material3.DayNight をAppCompatでダミー提供)
          cat > android/app/src/main/res/values/styles.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
            <style name="Theme.Material3.DayNight" parent="@style/Theme.AppCompat.Light.NoActionBar">
              <item name="colorPrimary">#6200EE</item>
              <item name="colorOnPrimary">#FFFFFF</item>
              <item name="colorPrimaryContainer">#BB86FC</item>
              <item name="colorOnPrimaryContainer">#000000</item>
              <item name="colorSecondary">#03DAC5</item>
              <item name="colorOnSecondary">#000000</item>
              <item name="colorSecondaryContainer">#018786</item>
              <item name="colorOnSecondaryContainer">#FFFFFF</item>
              <item name="colorTertiary">#FF5722</item>
              <item name="colorOnTertiary">#FFFFFF</item>
              <item name="colorSurface">#FFFFFF</item>
              <item name="colorOnSurface">#000000</item>
            </style>
          </resources>
          EOF

      - name: Clean and Assemble app (no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: >
            :app:clean :app:assembleDebug
            --stacktrace --warning-mode all --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1 || true)
          echo "APK=${APK:-NOT_FOUND}"
          mkdir -p artifacts
          if [ -n "$APK" ]; then
            cp "$APK" artifacts/app-debug.apk
            sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt
          fi

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
