name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-beta6)'
        required: true
        default: 'v0.9.0-beta6'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure local.properties and settings
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            printf 'rootProject.name = "fight-calendar"\ninclude(":app")\n' > android/settings.gradle.kts
          fi
          ls -la android

      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.6
          arguments: assembleDebug

      - name: Collect APK and SHA-256
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Debug APK not found. If your module name is not 'app', change the task to ':yourModule:assembleDebug'."
            exit 1
          fi
          echo "APK=$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
