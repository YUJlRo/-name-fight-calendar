name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-beta16)'
        required: true
        default: 'v0.9.0-beta16'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 安定の v2（api-level / build-tools 直指定）
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # settings を改行保証で再作成
      - name: Reset settings.gradle.kts (force newline)
        shell: bash
        run: |
          rm -f android/settings.gradle android/settings.gradle.kts
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement {
            repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "fight-calendar"
          include(":app")
          EOF
          echo "----- settings.gradle.kts -----"
          nl -ba android/settings.gradle.kts

      # これが今回のエラー対策（AndroidXを有効化）
      - name: Write gradle.properties (AndroidX)
        shell: bash
        run: |
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF
          echo "----- gradle.properties -----"
          cat android/gradle.properties

      - name: Build debug APK (Gradle 8.7)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: :app:assembleDebug --stacktrace --info

      - name: Prepare artifacts
        if: success()
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "::error::Debug APK not found. If your module name is not 'app', change the task to ':yourModule:assembleDebug'."
            exit 1
          fi
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: artifacts/app-debug.apk,artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
