name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-betaX)'
        required: true
        default: 'v0.9.0-betaX'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure gradle files
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          # settings.gradle.kts（念のため再生成）
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "fight-calendar"
          include(":app")
          EOF
          # AndroidX
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

      # これ1本でビルド＋ログ保存＋末尾表示
      - name: Assemble (capture full log)
        working-directory: android
        shell: bash
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug --no-daemon --stacktrace --warning-mode all -Dorg.gradle.console=plain 2>&1 | tee build.log || true
          echo "──── Last 400 lines of build.log ────" | tee -a "$GITHUB_STEP_SUMMARY"
          tail -n 400 build.log | tee -a "$GITHUB_STEP_SUMMARY" || true
          echo "──────────────────────────────────────" | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Upload build.log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: android/build.log
          if-no-files-found: warn
