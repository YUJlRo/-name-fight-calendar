name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-beta33)'
        required: true
        default: 'v0.9.0-beta33'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      # Manifestをクリーンな最小版で上書き（BOM/ゴミ防止）
      - name: Rewrite AndroidManifest.xml (no BOM, minimal)
        shell: bash
        run: |
          cat > android/app/src/main/AndroidManifest.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.fightcalendar.app">
              <application
                  android:allowBackup="true"
                  android:label="Fight Calendar"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:roundIcon="@android:drawable/sym_def_app_icon"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF
          sed -i 's/\r$//' android/app/src/main/AndroidManifest.xml
          perl -0777 -pe 's/^\x{FEFF}//' -i android/app/src/main/AndroidManifest.xml
          head -n 3 android/app/src/main/AndroidManifest.xml || true

      # MainActivityを最小版で上書き（Compose/Hilt等の参照を排除）
      - name: Rewrite MainActivity.kt (minimal)
        shell: bash
        run: |
          mkdir -p android/app/src/main/java/com/fightcalendar/app
          cat > android/app/src/main/java/com/fightcalendar/app/MainActivity.kt << 'EOF'
          package com.fightcalendar.app
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.FrameLayout
          import android.widget.TextView
          import androidx.appcompat.app.AppCompatActivity
          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  val root = FrameLayout(this)
                  val tv = TextView(this).apply {
                      text = "Fight Calendar"
                      textSize = 20f
                      setPadding(32, 32, 32, 32)
                      gravity = Gravity.CENTER
                  }
                  root.addView(tv)
                  setContentView(root)
              }
          }
          EOF

      # MainActivity以外の.ktを一時的に退避（CI内のみ）
      - name: Temporarily hide extra Kotlin sources
        shell: bash
        run: |
          set -e
          # .kt 全検索 → MainActivity以外は .bak にリネームしてビルド対象から外す
          find android/app/src/main -name "*.kt" ! -path "*/com/fightcalendar/app/MainActivity.kt" -exec bash -lc 'mv "$1" "$1.bak"' _ {} \; || true
          echo "Remaining Kotlin sources:"
          find android/app/src/main -name "*.kt" -maxdepth 5 | sed 's/^/  /' || true
- name: Rewrite settings.gradle.kts (clean pluginManagement)
  shell: bash
  run: |
    cat > android/settings.gradle.kts << 'EOF'
    pluginManagement {
      repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
      }
    }
    dependencyResolutionManagement {
      repositories {
        google()
        mavenCentral()
      }
    }
    rootProject.name = "fight-calendar"
    include(":app")
    EOF
    sed -i 's/\r$//' android/settings.gradle.kts
    perl -0777 -pe 's/^\x{FEFF}//' -i android/settings.gradle.kts
    head -n 6 android/settings.gradle.kts || true

- name: Rewrite root build.gradle.kts (declare plugin versions)
  shell: bash
  run: |
    cat > android/build.gradle.kts << 'EOF'
    plugins {
        id("com.android.application") version "8.5.2" apply false
        id("org.jetbrains.kotlin.android") version "1.9.24" apply false
    }
    EOF
    sed -i 's/\r$//' android/build.gradle.kts
    perl -0777 -pe 's/^\x{FEFF}//' -i android/build.gradle.kts
    cat android/build.gradle.kts || true

      - name: Assemble app (no wrapper)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: >
            :app:clean :app:assembleDebug
            --stacktrace --warning-mode all --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          echo "APK=$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
