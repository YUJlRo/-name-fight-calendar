name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-betaX)'
        required: true
        default: 'v0.9.0-betaX'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure gradle files
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
          cat > android/settings.gradle.kts << 'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "fight-calendar"
          include(":app")
          EOF
          cat > android/gradle.properties << 'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          kotlin.code.style=official
          org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
          EOF

      - name: Assemble app (no wrapper, plain console)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: :app:assembleDebug --stacktrace --warning-mode all --console=plain

      - name: Prepare artifacts
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          echo "APK=$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
