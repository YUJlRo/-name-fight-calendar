name: Build debug APK
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag for release (e.g. v0.9.0-beta27)'
        required: true
        default: 'v0.9.0-beta27'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        with:
          api-level: 34
          build-tools: '34.0.0'

      - name: Ensure local.properties
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties

      - name: Assemble app (no wrapper, skip kapt)
        uses: gradle/gradle-build-action@v3
        with:
          build-root-directory: android
          gradle-version: 8.7
          arguments: >
            :app:clean :app:assembleDebug
            --stacktrace --warning-mode all --console=plain
            -x kaptDebugKotlin
            -x kaptReleaseKotlin
            -x kaptGenerateStubsDebugKotlin
            -x kaptGenerateStubsReleaseKotlin
            -x kaptAndroidTestKotlin
            -x kaptGenerateStubsAndroidTestKotlin

      - name: Prepare artifacts
        shell: bash
        run: |
          APK=$(find android -path "*/outputs/apk/debug/*.apk" -name "*.apk" | head -n 1)
          echo "APK=$APK"
          mkdir -p artifacts
          cp "$APK" artifacts/app-debug.apk
          sha256sum artifacts/app-debug.apk | tee artifacts/SHA256.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          prerelease: true
          files: |
            artifacts/app-debug.apk
            artifacts/SHA256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
